<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝莓的学习进度工作台 · Atelier of Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 装饰背景 ===== -->
<div class="bg-decoration">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- ===== 侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" width="36" height="36">
        <circle cx="20" cy="20" r="18" fill="none" stroke="var(--gold)" stroke-width="1.5"/>
        <path d="M12 20 L18 26 L28 14" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="brand-title">蓝莓学习工作台</h1>
    <p class="brand-sub">Atelier of Learning</p>
  </div>

  <nav class="nav-list" id="navList">
    <!-- 导航项由JS动态生成 -->
  </nav>

  <div class="sidebar-footer">
    <button class="btn-add-section" onclick="openAddSectionModal()">
      <span class="plus-icon">+</span> 新增板块
    </button>
    <div class="data-actions">
      <button class="btn-icon" onclick="exportData()" title="导出数据备份">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      </button>
      <button class="btn-icon" onclick="document.getElementById('importFile').click()" title="导入数据备份">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V3m0 0l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</aside>

<!-- ===== 主内容区 ===== -->
<main class="main-content" id="mainContent">
  <!-- 顶部栏 -->
  <header class="top-bar">
    <button class="menu-toggle" id="menuToggle">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="top-bar-title" id="topBarTitle">首页</div>
    <div class="top-bar-right">
      <div class="storage-status" id="storageStatus" title="数据自动持久化状态">
        <span class="storage-dot"></span><span class="storage-text">加载中…</span>
      </div>
      <div class="clock-widget" id="clockWidget">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">加载中...</div>
      </div>
    </div>
  </header>

  <!-- 页面容器 -->
  <div class="page-container" id="pageContainer">
    <!-- 内容由JS动态生成 -->
  </div>
</main>

<!-- ===== 模态框容器 ===== -->
<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal-container" id="modalContainer"></div>

<!-- ===== 右键上下文菜单 ===== -->
<div class="context-menu" id="contextMenu"></div>

<!-- ===== Toast 提示 ===== -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
